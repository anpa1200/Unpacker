# Unpacker configuration

detector:
  confidence_threshold: 0.5

orchestrator:
  max_layers: 5
  timeout_seconds: 60
  total_timeout_seconds: 300
  max_output_size_mb: 32
  max_total_output_size_mb: 128
  max_output_entries: 4096
  rebuild_iat: false
  allow_emulation: false

unpackers:
  # Prefer native UPX when available
  upx_prefer_native: true
