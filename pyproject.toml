[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "1200km-unpacker"
version = "1.0.0"
description = "Modular malware packer detection and unpacking tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Andrey Pautov", email = "1200km@gmail.com" },
]
keywords = ["malware", "unpacker", "packer-detection", "reverse-engineering", "cti"]
dependencies = [
    "pefile>=2023.2.7",
    "pyelftools>=0.30",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/anpa1200/Unpacker"
Repository = "https://github.com/anpa1200/Unpacker"
Documentation = "https://medium.com/@1200km/unpacker-a-practical-guide-to-modular-malware-packer-detection-and-unpacking-cf8ba924f25b"
Issues = "https://github.com/anpa1200/Unpacker/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
emulation = ["qiling>=1.4.5"]
# ASPack / Themida (PE32) unpacking via Unipacker. unipacker's own dependency
# chain (unicorn) still imports distutils/pkg_resources, both removed or being
# phased out of Python 3.12+ and newer setuptools, so a compatible setuptools
# is pinned alongside it rather than left to the user to discover.
unipacker = ["unipacker", "setuptools<81"]

[project.scripts]
unpacker = "unpacker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
