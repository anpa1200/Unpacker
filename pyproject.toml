[build-system]
requires = ["setuptools>=84.1.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "1200km-unpacker"
version = "1.2.0rc13"
description = "Modular malware packer detection and unpacking tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Andrey Pautov", email = "1200km@gmail.com" },
]
keywords = ["malware", "unpacker", "packer-detection", "reverse-engineering", "cti"]
dependencies = [
    "pefile>=2023.2.7",
    "pyelftools>=0.30",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/anpa1200/Unpacker"
Repository = "https://github.com/anpa1200/Unpacker"
Documentation = "https://medium.com/@1200km/unpacker-a-practical-guide-to-modular-malware-packer-detection-and-unpacking-cf8ba924f25b"
Issues = "https://github.com/anpa1200/Unpacker/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
emulation = ["qiling>=1.4.5"]
# Reviewed offline Linux runtime supplied with the release bundle. The local
# version identifies the maintained binding/core build; it is not on PyPI.
unipacker = ["unipacker==1.0.8", "unicorn-unipacker==1.0.3b7+unpacker.1"]
acquisition = ["requests>=2.28", "pyzipper>=0.3.5"]
ai = ["pydantic>=2.7,<3", "python-dotenv>=1,<2"]
config = ["PyYAML>=6,<7"]
crypto = ["cryptography>=43"]
ai-openai = ["pydantic>=2.7,<3", "python-dotenv>=1,<2", "openai>=1.50,<3"]
ai-claude = ["pydantic>=2.7,<3", "python-dotenv>=1,<2", "anthropic>=0.40,<1"]
ai-gemini = ["pydantic>=2.7,<3", "python-dotenv>=1,<2", "google-genai>=1.20,<3"]

[project.scripts]
unpacker = "unpacker.cli:main"
unpacker-ai = "unpacker.ai.cli:main"
unpacker-sandbox = "unpacker.sandbox_cli:main"
unpacker-worker = "unpacker.worker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
