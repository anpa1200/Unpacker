name: Package publication disabled pending production gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain-blocker:
    runs-on: ubuntu-latest
    steps:
      - name: Require a separately approved release
        run: |
          echo "Package publication is disabled. See docs/CURRENT_STATUS.md and docs/PRODUCTION_RELEASE.md."
          echo "This source/documentation push does not authorize a release, tag, deployment or PyPI upload."
          exit 1
